<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Star RP | Senior Administrator Application</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 15px;
            margin-bottom: 20px;
            gap: 10px;
        }
        .header h1 {
            font-size: 18px;
            margin: 0;
            color: #58a6ff;
        }
        .staff-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        .staff-btn:hover { background-color: #30363d; }
        .form-step { display: none; }
        .form-step.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        input:focus, textarea:focus { border-color: #58a6ff; outline: none; }
        .btn-group { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn:hover { background-color: #2ea043; }
        .btn-prev { background-color: #30363d; }
        .btn-prev:hover { background-color: #484f58; }
        
        /* Staff Portal Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #161b22;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #30363d;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }
        .close-btn {
            background: #da3633;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>City Star RP | Senior Administrator Application</h1>
        <button type="button" class="staff-btn" onclick="openPortal()">Staff Portal</button>
    </div>

    <form id="appForm">
        <!-- Page 1 -->
        <div class="form-step active" id="step1">
            <h3>Step 1: Basic Information</h3>
            <div class="form-group">
                <label>In-Game Name (IGN) *</label>
                <input type="text" id="ign" required placeholder="Enter your character name">
            </div>
            <div class="form-group">
                <label>Discord Username & ID *</label>
                <input type="text" id="discord" required placeholder="e.g. rakib#0001 / 123456789012345678">
            </div>
            <div class="form-group">
                <label>Real Age *</label>
                <input type="number" id="age" required placeholder="Enter your age">
            </div>
            <div class="btn-group" style="justify-content: flex-end;">
                <button type="button" class="btn" onclick="nextStep()">Next Page ➔</button>
            </div>
        </div>

        <!-- Page 2 -->
        <div class="form-step" id="step2">
            <h3>Step 2: Experience & Scenarios</h3>
            <div class="form-group">
                <label>Previous Admin Experience *</label>
                <textarea id="experience" rows="3" required placeholder="Describe your past staff roles..."></textarea>
            </div>
            <div class="form-group">
                <label>Why do you want to be a Senior Admin in City Star RP? *</label>
                <textarea id="reason" rows="3" required placeholder="Write your answer..."></textarea>
            </div>
            <div class="btn-group">
                <button type="button" class="btn btn-prev" onclick="prevStep()">⬅ Previous</button>
                <button type="submit" class="btn" id="submitBtn">Submit Application</button>
            </div>
        </div>
    </form>
</div>

<!-- Staff Portal Modal -->
<div class="modal" id="staffModal">
    <div class="modal-content">
        <h3 style="color:#58a6ff; margin-top:0;">Staff Portal Login</h3>
        <p style="font-size: 13px; color: #8b949e;">Authorized City Star RP Staff Only</p>
        <input type="password" id="staffPass" placeholder="Enter Staff PIN (Default: 1234)" style="margin-bottom: 10px;">
        <button type="button" class="btn" style="width:100%;" onclick="checkStaff()">Login</button>
        <button type="button" class="close-btn" onclick="closePortal()">Close</button>
    </div>
</div>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1573062730078888096/WBOmI8L4miiRdZp_2VchDv7hCAGIxmrYBtK6yyBL6V89nw1NvwBL-AADE9uYBLmKxaW8";

    // Staff Portal Functions
    function openPortal() {
        document.getElementById("staffModal").style.display = "flex";
    }
    function closePortal() {
        document.getElementById("staffModal").style.display = "none";
    }
    function checkStaff() {
        const pass = document.getElementById("staffPass").value;
        if (pass === "1234") {
            alert("Access Granted! Welcome to City Star RP Staff Panel.");
            closePortal();
        } else {
            alert("Incorrect Staff PIN!");
        }
    }

    // Multi-step Navigation
    function nextStep() {
        const ign = document.getElementById("ign").value.trim();
        const discord = document.getElementById("discord").value.trim();
        const age = document.getElementById("age").value.trim();

        if (!ign || !discord || !age) {
            alert("Please fill out all required fields before going to the next page!");
            return;
        }
        document.getElementById("step1").classList.remove("active");
        document.getElementById("step2").classList.add("active");
    }

    function prevStep() {
        document.getElementById("step2").classList.remove("active");
        document.getElementById("step1").classList.add("active");
    }

    // Form Submit & Webhook Integration
    document.getElementById("appForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.innerText = "Submitting...";
        submitBtn.disabled = true;

        const payload = {
            username: "01 | Application For Senior Administrator",
            embeds: [{
                title: "📋 New Senior Administrator Application",
                color: 5814783,
                fields: [
                    { name: "In-Game Name (IGN)", value: document.getElementById("ign").value, inline: true },
                    { name: "Discord Username & ID", value: document.getElementById("discord").value, inline: true },
                    { name: "Real Age", value: document.getElementById("age").value, inline: true },
                    { name: "Previous Admin Experience", value: document.getElementById("experience").value },
                    { name: "Why Senior Admin in City Star RP?", value: document.getElementById("reason").value }
                ],
                footer: { text: "City Star RP | Application System" },
                timestamp: new Date().toISOString()
            }]
        };

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (response.ok) {
                alert("✅ Application Submitted Successfully to City Star RP!");
                document.getElementById("appForm").reset();
                prevStep();
            } else {
                alert("❌ Failed to send application. Please contact server management.");
            }
        })
        .catch(error => {
            alert("❌ Network Error: Could not connect to Discord.");
        })
        .finally(() => {
            submitBtn.innerText = "Submit Application";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
