<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>City Star RP | Senior Administrator Application</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        body {
            font-family: 'Poppins', sans-serif;
            color: #f1f5f9;
            background-color: #0a0e17;
            background-image: linear-gradient(135deg, rgba(10, 14, 23, 0.88), rgba(18, 12, 36, 0.92)),
                              url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding-bottom: 60px;
        }

        /* Top Navbar */
        .top-bar {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .staff-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .staff-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        /* Main Wrapper - Fixed for Smooth Mobile Scrolling */
        .main-wrapper {
            width: 100%;
            padding: 5px 15px 40px 15px;
            display: block;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 16px;
            padding: 25px 20px;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(139, 92, 246, 0.15);
        }

        .header-box {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header-box h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 19px;
            line-height: 1.4;
            background: linear-gradient(90deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.8px;
        }
        .header-box p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }

        /* Progress Bar */
        .progress-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 22px;
            gap: 8px;
        }
        .step-pill {
            flex: 1;
            text-align: center;
            padding: 9px 6px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            color: #64748b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.3s;
        }
        .step-pill.active {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.2), rgba(168, 85, 247, 0.2));
            color: #fff;
            border-color: #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .form-step { display: none; animation: fadeIn 0.35s ease; }
        .form-step.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 500;
            font-size: 14px;
            color: #e2e8f0;
            line-height: 1.5;
        }
        label span { color: #f43f5e; }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 8px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            outline: none;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-bottom: 10px;
            gap: 12px;
        }
        .btn {
            background: linear-gradient(90deg, #0284c7, #7c3aed);
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
        }
        .btn-prev {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-prev:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        /* Post-Submission Reminder Box */
        #reminderScreen {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .success-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .note-box {
            background: rgba(56, 189, 248, 0.08);
            border-left: 4px solid #38bdf8;
            border-top: 1px solid rgba(56, 189, 248, 0.25);
            border-right: 1px solid rgba(56, 189, 248, 0.25);
            border-bottom: 1px solid rgba(56, 189, 248, 0.25);
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            margin: 15px 0 25px 0;
        }
        .note-box h3 {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .note-box p {
            color: #e2e8f0;
            font-size: 14px;
            line-height: 1.7;
        }

        /* Staff Dashboard */
        #staffView { display: none; }
        .app-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 13px;
            line-height: 1.6;
        }
        .app-card strong { color: #38bdf8; }
    </style>
</head>
<body>

<div class="top-bar">
    <button type="button" class="staff-btn" id="toggleStaffBtn" onclick="toggleStaffPanel()">🛡️ Staff Panel</button>
</div>

<div class="main-wrapper">
    <!-- Player Application Card -->
    <div class="glass-card" id="playerView">
        <div class="header-box">
            <h1>City Star RP | Senior Administrator Application</h1>
            <p>Questions for Senior Admin Interview Application</p>
        </div>

        <div id="formContainer">
            <div class="progress-container">
                <div class="step-pill active" id="pill1">Page 1: General Queries</div>
                <div class="step-pill" id="pill2">Page 2: Questions</div>
            </div>

            <form id="appForm">
                <!-- PAGE 1: General Queries (6 Questions) -->
                <div class="form-step active" id="step1">
                    <div class="form-group">
                        <label>1. What's your Real Name? <span>*</span></label>
                        <input type="text" id="p1_q1" required placeholder="Enter your real name">
                    </div>
                    <div class="form-group">
                        <label>2. What's your Age? <span>*</span></label>
                        <input type="number" id="p1_q2" required placeholder="Enter your real age">
                    </div>
                    <div class="form-group">
                        <label>3. What's your Place of Residence and Timezone? <span>*</span></label>
                        <input type="text" id="p1_q3" required placeholder="e.g. Dhaka, Bangladesh (GMT+6)">
                    </div>
                    <div class="form-group">
                        <label>4. What's Your IC Name? <span>*</span></label>
                        <input type="text" id="p1_q4" required placeholder="Enter your In-Character name">
                    </div>
                    <div class="form-group">
                        <label>5. General Playtime and availability you can offer to administration: <span>*</span></label>
                        <input type="text" id="p1_q5" required placeholder="e.g. 4-5 hours daily">
